<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PUBLICAÇÕES · Estúdio Problems</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icone-180.png">
<script src="/estudio-login.js"></script>
<script src="/estudio-youtube.js"></script>
<style>
:root{--bg:#161618;--p:#1f1f23;--ln:rgba(255,255,255,.1);--tx:#f5f5f7;--mu:#a1a1a6;--mu2:#6e6e73;--ac:#0a84ff;--ok:#30d158;--am:#ffcc33;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(22,22,24,.85);backdrop-filter:blur(18px);border-bottom:.5px solid var(--ln);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;min-width:0}.logo .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:#2b0a0a;color:#ff5a4f;border:1px solid #ff5a4f;flex:none}
.logo b{font-weight:800;font-size:18px;letter-spacing:1px;display:block;line-height:1.1}.logo small{color:var(--mu);font-size:11.5px}
.sp{flex:1}
.bt{height:30px;padding:0 12px;border-radius:8px;border:.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.bt:hover{background:rgba(255,255,255,.14)}.bt:disabled{opacity:.45;cursor:default}
.bt.pri{background:linear-gradient(180deg,#2a92ff,#0a7aff);border-color:transparent;color:#fff}.bt.pri:hover{filter:brightness(1.08)}
.bt.sm{height:26px;padding:0 9px;font-size:12.5px}.bt.perigo{color:#ff6961}
.bt svg{width:15px;height:15px}
main{max-width:1120px;margin:0 auto;padding:18px 16px 60px}
.aviso{background:rgba(255,204,51,.1);border:.5px solid rgba(255,204,51,.4);border-radius:10px;padding:10px 12px;margin-bottom:14px;color:#ffe08a}
.erro{background:rgba(255,69,58,.12);border:.5px solid rgba(255,69,58,.45);border-radius:10px;padding:10px 12px;margin:10px 0;color:#ffb0aa}
h2{font-size:15px;margin:22px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}h2 small{color:var(--mu);font-weight:400;font-size:12.5px}
.fila{display:grid;gap:8px}
.cx{background:var(--p);border:.5px solid var(--ln);border-radius:12px}
.esp-it{display:flex;align-items:center;gap:12px;padding:10px 12px;flex-wrap:wrap}
.esp-it video{width:96px;height:54px;border-radius:6px;background:#000;object-fit:cover;flex:none}
.esp-it .ph{width:96px;height:54px;border-radius:6px;background:#2a2a2f;display:grid;place-items:center;color:var(--mu2);font-size:11px;flex:none;text-align:center}
.esp-it .tx{flex:1;min-width:180px}.esp-it .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.esp-it small{color:var(--mu)}
.esp-it input[type=checkbox]{width:16px;height:16px;flex:none}
.hoje{padding:14px;display:grid;gap:10px}.hoje .resumo{color:var(--mu);font-size:13px}.hoje .resumo b{color:var(--tx)}
.abas{display:flex;gap:4px;flex-wrap:wrap;margin:18px 0 10px;padding:3px;border-radius:10px;background:rgba(0,0,0,.3);width:max-content;max-width:100%}
.abas button{border:0;background:none;height:28px;padding:0 12px;border-radius:8px;cursor:pointer;color:var(--mu)}
.abas button.on{background:rgba(255,255,255,.14);color:var(--tx)}.abas i{font-style:normal;font-size:11.5px;margin-left:5px;color:var(--mu2)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filtros input,.filtros select{height:30px;background:rgba(0,0,0,.25);border:.5px solid rgba(255,255,255,.14);border-radius:8px;padding:0 9px;outline:none;max-width:100%}
.filtros input[type=search]{flex:1 1 220px;min-width:160px}
.filtros input:focus,.filtros select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(10,132,255,.3)}
.lista{display:grid;gap:8px}
.it{display:flex;gap:12px;padding:10px 12px;align-items:center}
.it .th{width:128px;aspect-ratio:16/9;border-radius:7px;background:#000 center/cover no-repeat;flex:none;display:block}
.it .tx{flex:1;min-width:0;display:grid;gap:3px}.it .tx b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--mu);font-size:12.5px}
.canal{display:inline-flex;align-items:center;gap:6px}.canal img,.canal .sem{width:18px;height:18px;border-radius:50%;background:#333;flex:none}
.chip{font-size:11.5px;padding:1px 8px;border-radius:20px;border:.5px solid currentColor;white-space:nowrap}
.chip.noAr{color:var(--ok)}.chip.agendado{color:var(--am)}.chip.naoListado{color:#64d2ff}.chip.privado,.chip.studio{color:var(--mu)}.chip.pedido{color:#bf8cff}.chip.concluido{color:#ff9f0a}
.it .ac,.esp-it .ac{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.vz{color:var(--mu2);padding:26px;text-align:center}
.rod{color:var(--mu2);font-size:12px;margin-top:14px}
.quem{display:inline-flex;align-items:center;gap:5px}.quem img{width:16px;height:16px;border-radius:50%}
.fundo{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px}
.jan{width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#242428;border:.5px solid rgba(255,255,255,.14);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.6);padding:18px 20px}
.jan h3{margin:0 0 12px;font-size:16px}
.jan label.r{display:block;font-size:12px;color:var(--mu);margin:12px 0 4px}
.jan input[type=text],.jan input[type=datetime-local],.jan input[type=file],.jan textarea,.jan select{width:100%;background:rgba(0,0,0,.25);border:.5px solid rgba(255,255,255,.14);border-radius:8px;padding:7px 10px;outline:none}
.jan textarea{min-height:90px;resize:vertical}
.jan input:focus,.jan textarea:focus,.jan select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(10,132,255,.3)}
.jan video{width:100%;max-height:220px;border-radius:8px;background:#000}
.canal-cx{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.25);border:.5px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 10px}
.canal-cx img,.canal-cx .sem{width:32px;height:32px;border-radius:50%;background:#333;flex:none}.canal-cx .tx{flex:1;min-width:0}.canal-cx small{color:var(--mu);display:block}
.seg{display:inline-flex;padding:2px;border-radius:8px;background:rgba(0,0,0,.3);flex-wrap:wrap}.seg button{border:0;background:none;min-height:28px;padding:3px 12px;border-radius:6px;cursor:pointer}.seg button.on{background:rgba(255,255,255,.16)}
.vias{display:grid;gap:6px}.vias button{text-align:left;border:.5px solid rgba(255,255,255,.14);background:rgba(0,0,0,.2);border-radius:10px;padding:8px 12px;cursor:pointer}
.vias button.on{border-color:var(--ac);background:rgba(10,132,255,.14)}.vias button small{display:block;color:var(--mu);font-size:12px}.vias button:disabled{opacity:.45;cursor:default}
.opc{display:flex;gap:16px;flex-wrap:wrap}.opc label{display:flex;gap:6px;align-items:center;font-size:13px}
.nota{font-size:12px;color:var(--mu);margin-top:8px}
.pes{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.barra{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin:14px 0 6px}.barra i{display:block;height:100%;width:0;background:#fff;transition:width .2s}
.okcx{background:rgba(48,209,88,.12);border:.5px solid rgba(48,209,88,.45);border-radius:10px;padding:10px 12px}.jan a{color:#64d2ff;word-break:break-all}
.cola{display:grid;gap:6px;background:rgba(0,0,0,.2);border-radius:10px;padding:10px 12px;margin-top:8px}
.cola .l{display:flex;gap:10px;align-items:flex-start}.cola .l span{color:var(--mu);width:120px;flex:none;font-size:12.5px}.cola .l b{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;font-weight:500}
.passo{display:flex;gap:10px;align-items:center;margin-top:12px}.passo i{font-style:normal;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:12px;flex:none}
.canais-ed{display:grid;gap:6px}.canais-ed .l{display:flex;gap:6px}.canais-ed input{flex:1}
.prog-l{display:grid;gap:6px;margin-top:10px}.prog-l .l{display:flex;gap:8px;font-size:13px}.prog-l .l b{flex:1;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.prog-l .l span{color:var(--mu)}
@media (max-width:700px){.it{flex-wrap:wrap}.it .th{width:100%}.it .ac{justify-content:flex-start}.abas{width:100%}.cola .l{flex-wrap:wrap}.cola .l span{width:100%}}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg></span><div><b>PUBLICAÇÕES</b><small>Estúdio Problems · vídeos no YouTube</small></div></div>
  <div class="sp"></div>
  <button class="bt" id="btCanais" hidden title="Canais da equipe (nome e ID): todo mundo escolhe nesta lista">Canais da equipe</button>
  <button class="bt" id="btConferir" title="Pergunta ao YouTube a situação dos SEUS vídeos neste canal (só para quem é gerente ou dono do canal)">Conferir no YouTube</button>
  <button class="bt" id="btAtualizar" title="Busca a lista da equipe de novo">Atualizar</button>
  <button class="bt pri" id="btNovo">Enviar um vídeo</button>
  <input type="file" id="arq" accept="video/*" hidden>
  <span data-estudio-conta></span>
</header>
<main>
  <div id="avisos"></div>
  <div id="esperando"></div>
  <h2>Hoje <small id="hojeData"></small></h2>
  <div class="cx hoje" id="hoje"></div>
  <div class="abas" id="abas"></div>
  <div class="filtros">
    <input type="search" id="fBusca" placeholder="Buscar pelo título…" aria-label="Buscar pelo título">
    <select id="fCanal" aria-label="Canal"></select>
    <select id="fProg" aria-label="Programa de origem"></select>
    <select id="fPer" aria-label="Período"><option value="tudo">Qualquer data</option><option value="7">Últimos 7 dias</option><option value="30">Últimos 30 dias</option><option value="90">Últimos 3 meses</option><option value="prox">Daqui para a frente</option></select>
    <select id="fQuem" aria-label="Quem enviou"></select>
    <select id="fOrd" aria-label="Ordem"><option value="rec">Mais recentes primeiro</option><option value="ant">Mais antigos primeiro</option><option value="tit">Título (A–Z)</option></select>
    <button class="bt sm" id="fLimpa">Limpar filtros</button>
  </div>
  <div class="lista" id="lista"></div>
  <div class="rod" id="rodInfo"></div>
</main>
<script>
'use strict';
/* PUBLICAÇÕES (pedido da dona, 05/11/2026). Três jeitos de mandar um vídeo:
   1. DIRETO (gerente/dono da conta de marca do canal): o vídeo vai do navegador direto para o YouTube pela API (/estudio-youtube.js).
   2. PELO YOUTUBE STUDIO (editor do canal: a API não aceita quem só tem permissão do Studio): o Publicações mostra a "colinha"
      (título, descrição, crianças, visibilidade), baixa o vídeo, abre o envio do Studio no canal certo e a pessoa cola o link no fim.
   3. DEIXAR NA FILA: vira um PEDIDO na lista da equipe (só os dados; o vídeo fica neste navegador) e um gerente publica depois
      ("Publicar a fila": vários de uma vez, um depois do outro, pela API oficial).
   - Os outros programas deixam o vídeo no IndexedDB 'ep-publicacoes' e abrem esta página com ?video=<id>.
   - A LISTA da equipe (itens, pedidos e os CANAIS que os ADMs cadastram) é UM JSON no turma-ia (GET/POST/DELETE /publicacoes),
     guardado no localStorage 'ep-publicacoes-v1' e buscado de novo só se tiver mais de 10 min (ou no "Atualizar"). Filtros e ordem
     rodam aqui, guardados em 'ep-publicacoes-filtro'.
   - Agendado: lembrete no calendário pessoal do Estúdio ('ep-calendario', o mesmo do relógio do estudio-conta.js). */
const SERV = 'https://turma-ia.problemsraiz.workers.dev', LS = 'ep-publicacoes-v1', LSF = 'ep-publicacoes-filtro', VELHA = 10 * 60e3;
const YT = window.EstudioYouTube, $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pode = k => { try { return window.EstudioPerm?.pode?.(k) ?? true; } catch { return true; } };
const PROGS = { animador: 'Animador', shorts: 'Shorts', editor: 'Editor', publicacoes: 'Publicações' };
const mb = n => { const m = (n || 0) / 1048576; return (m < 10 ? m.toFixed(1).replace('.', ',') : Math.round(m)) + ' MB'; };
const hora = t => new Date(t).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const dataH = t => { const d = new Date(t), h = new Date(); const dia = d.toDateString() === h.toDateString() ? 'hoje' : new Date(+h + 864e5).toDateString() === d.toDateString() ? 'amanhã' : new Date(+h - 864e5).toDateString() === d.toDateString() ? 'ontem' : d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: d.getFullYear() !== h.getFullYear() ? 'numeric' : undefined }).replace('.', ''); return `${dia} às ${hora(t)}`; };
const mesmoDia = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
const novoId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const idDoLink = s => { s = String(s || '').trim(); const m = /(?:youtu\.be\/|[?&]v=|\/shorts\/|\/video\/|\/live\/|\/embed\/)([A-Za-z0-9_-]{11})/.exec(s); return m ? m[1] : /^[A-Za-z0-9_-]{11}$/.test(s) ? s : null; };
const canalDoTexto = s => { const m = /(UC[A-Za-z0-9_-]{22})/.exec(String(s || '')); return m ? m[1] : null; };
const privDe = modo => modo === 'agora' ? 'public' : modo === 'agendado' ? 'private' : 'unlisted';
const MODOS = { naoListado: 'Não listado', agora: 'Público (publicar agora)', agendado: 'Agendado' };

// ---------- situação de cada item ----------
const estado = i => i.pedido ? 'pedido' : i.concluido ? 'concluido' : i.privacidade === 'unlisted' ? 'naoListado' : i.privacidade === 'public' ? 'noAr' : i.publicaEm ? (i.publicaEm > Date.now() ? 'agendado' : 'noAr') : 'privado';
const ROT = { noAr: 'No ar', agendado: 'Agendado', naoListado: 'Não listado', privado: 'Privado', pedido: 'Na fila', concluido: 'Não publicado' };
const quando = i => i.pedido ? (i.publicaEm || i.enviadoEm) : (estado(i) === 'agendado' || (i.publicaEm && estado(i) === 'noAr') ? i.publicaEm : i.enviadoEm);

// ---------- lista da equipe (um JSON, com cache) ----------
let L = (() => { try { const v = JSON.parse(localStorage.getItem(LS) || 'null'); return v && Array.isArray(v.itens) ? { canais: [], ...v } : { itens: [], canais: [], em: 0 }; } catch { return { itens: [], canais: [], em: 0 }; } })();
const guardaL = v => { L = { itens: v.itens || [], canais: v.canais || [], adm: !!v.adm, mod: v.mod || 0, em: Date.now() }; try { localStorage.setItem(LS, JSON.stringify(L)); } catch { } };
const pede = async (caminho, op = {}) => {
  const t = await EstudioLogin.token(); const r = await fetch(SERV + caminho, { ...op, headers: { ...(op.headers || {}), authorization: t, ...(op.body ? { 'content-type': 'application/json' } : {}) } });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j?.error?.message || `A nuvem respondeu ${r.status}.`); return j;
};
let buscando = null, erroNuvem = '';
const buscar = forca => { if (!forca && Date.now() - (L.em || 0) < VELHA) return Promise.resolve(); return buscando || (buscando = pede('/publicacoes').then(v => { guardaL(v); erroNuvem = ''; }).catch(e => { erroNuvem = e.message; }).finally(() => { buscando = null; pinta(); pintaEsperando(); })); };
const salvaItem = async (item, substitui) => { guardaL(await pede('/publicacoes', { method: 'POST', body: JSON.stringify({ item, ...(substitui ? { substitui } : {}) }) })); pinta(); };

// ---------- nomes de quem enviou ----------
const NOMES = {};
const nomeDe = async u => { if (!u || NOMES[u]) return; NOMES[u] = { nome: '…' }; try { const q = await window.EstudioConta?.quem?.(u); NOMES[u] = { nome: q?.nome || 'Alguém da equipe', foto: q?.foto || '' }; } catch { NOMES[u] = { nome: 'Alguém da equipe' }; } pinta(); pintaEsperando(); };

// ---------- filtros ----------
const F0 = { aba: 'todos', busca: '', canal: '', prog: '', per: 'tudo', quem: '', ord: 'rec' };
let F = (() => { try { return { ...F0, ...JSON.parse(localStorage.getItem(LSF) || '{}') }; } catch { return { ...F0 }; } })();
const guardaF = () => { try { localStorage.setItem(LSF, JSON.stringify(F)); } catch { } };
const ABAS = [['todos', 'Todos'], ['concluido', 'Não publicados'], ['agendado', 'Futuros'], ['naoListado', 'Não listados'], ['noAr', 'Publicados / no ar']];
const passa = (i, semAba) => {
  if (i.pedido) return false; // pedidos aparecem só em "Esperando publicação"
  const e = estado(i);
  if (!semAba && F.aba !== 'todos' && e !== F.aba) return false;
  if (F.canal && i.canal?.id !== F.canal) return false;
  if (F.prog && (i.programa || 'publicacoes') !== F.prog) return false;
  if (F.quem === 'eu' ? !i.meu : F.quem && i.por !== F.quem) return false;
  if (F.busca && !String(i.titulo || '').toLowerCase().includes(F.busca.toLowerCase())) return false;
  const t = quando(i);
  if (F.per === 'prox') { if (!(t >= new Date().setHours(0, 0, 0, 0))) return false; }
  else if (F.per !== 'tudo' && t < Date.now() - +F.per * 864e5) return false;
  return true;
};

// ---------- pintar ----------
const thumb = id => `https://i.ytimg.com/vi/${encodeURIComponent(id)}/mqdefault.jpg`;
const canalHtml = c => `<span class="canal">${c?.foto ? `<img src="${esc(c.foto)}" alt="" referrerpolicy="no-referrer">` : '<span class="sem"></span>'}${esc(c?.nome || 'Qualquer canal')}</span>`;
const quemHtml = u => { const n = NOMES[u]; if (!n) nomeDe(u); return `<span class="quem">${n?.foto ? `<img src="${esc(n.foto)}" alt="">` : ''}${esc(n?.nome || '…')}</span>`; };
const linhaQuando = i => { const e = estado(i), t = quando(i); return e === 'agendado' ? `sai ${dataH(t)}` : e === 'noAr' ? `${i.publicaEm ? 'saiu' : 'publicado'} ${dataH(t)}` : `enviado ${dataH(t)}`; };
function itemHtml(i) {
  if (i.concluido) return concHtml(i);
  const e = estado(i), link = 'https://youtu.be/' + encodeURIComponent(i.id);
  return `<div class="cx it"><a class="th" href="${link}" target="_blank" rel="noopener" style="background-image:url('${thumb(i.id)}')" aria-label="Abrir no YouTube"></a>
    <div class="tx"><b title="${esc(i.titulo)}">${esc(i.titulo || '(sem título)')}</b>
      <div class="ln"><span class="chip ${e}">${ROT[e]}</span><span>${linhaQuando(i)}</span>${canalHtml(i.canal)}</div>
      <div class="ln"><span>${esc(PROGS[i.programa] || 'Publicações')}</span>·${quemHtml(i.por)}${i.via === 'studio' ? '·<span class="chip studio" title="Enviado à mão pelo YouTube Studio: a situação é a que a pessoa marcou">pelo Studio</span>' : ''}</div></div>
    <div class="ac"><a class="bt sm" href="${link}" target="_blank" rel="noopener">Abrir</a><a class="bt sm" href="https://studio.youtube.com/video/${encodeURIComponent(i.id)}/edit" target="_blank" rel="noopener">Studio</a><button class="bt sm" data-cp="${esc(link)}">Copiar link</button>${e === 'agendado' ? `<button class="bt sm" data-lemb="${esc(i.id)}">${temLembrete(i.id) ? 'No calendário' : 'Lembrete'}</button>` : ''}${i.meu || L.adm ? `<button class="bt sm perigo" data-tira="${esc(i.id)}" title="Tira só desta lista (no YouTube o vídeo continua)">Tirar da lista</button>` : ''}</div></div>`;
}
// projeto marcado como concluído num programa (ainda não publicado): miniatura do próprio vídeo, publicar daqui ou abrir no programa
function concHtml(i) {
  const loc = ESP.find(v => v.concluido === i.id), podePub = pode('publicacoes.publicar');
  return `<div class="cx it"><span class="th" style="${i.thumb ? `background-image:url('${i.thumb}')` : ''}"></span>
    <div class="tx"><b title="${esc(i.titulo)}">${esc(i.titulo || '(sem título)')}</b>

  vd.onloadedmetadata = () => { vd.currentTime = Math.min(1, (vd.duration || 2) / 3); };
  vd.onseeked = () => { try { const c = document.createElement('canvas'); c.width = 160; c.height = 90; const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, 160, 90); const k = Math.min(160 / vd.videoWidth, 90 / vd.videoHeight), w = vd.videoWidth * k, h = vd.videoHeight * k; g.drawImage(vd, (160 - w) / 2, (90 - h) / 2, w, h); acaba(c.toDataURL('image/jpeg', .6)); } catch { acaba(''); } };
