<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PUBLICAÇÕES · Estúdio Problems</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icone-180.png">
<script src="/estudio-login.js"></script>
<script src="/estudio-youtube.js"></script>
<style>
/* VISUAL METRO (Windows 8), pedido da dona em 10/11/2026: blocos planos de cor sólida, letras finas e grandes, NADA arredondado,
   sem sombra, sem degradê, sem desfoque. Painéis entram deslizando pela direita, avisos são faixas na largura toda. */
:root{--bg:#1d1d1d;--p:#2a2a2a;--p2:#333;--p3:#3d3d3d;--ln:#454545;--tx:#fff;--mu:#a8a8a8;--mu2:#7a7a7a;--ac:#e51400;
  --local:#647687;--atr:#e51400;--concluido:#fa6800;--pedido:#a200ff;--agendado:#f0a30a;--naoListado:#1ba1e2;--noAr:#60a917;
  --leve:"Segoe UI Light","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--entra:cubic-bezier(.1,.9,.2,1);color-scheme:dark}
*{box-sizing:border-box;border-radius:0!important}[hidden]{display:none!important}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.4 "Segoe UI","Segoe UI Variable Text",system-ui,sans-serif;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
/* cabeçalho */
.top{display:flex;align-items:flex-end;gap:14px;padding:22px clamp(16px,4vw,56px) 4px;flex-wrap:wrap}
.top h1{margin:0;font:300 clamp(30px,4vw,46px)/1 var(--leve);letter-spacing:-.5px;display:flex;align-items:center;gap:14px}
.top h1 .ic{width:46px;height:46px;background:var(--ac);display:grid;place-items:center;flex:none}
.top h1 small{display:block;font:400 13px/1.3 "Segoe UI",system-ui,sans-serif;color:var(--mu);letter-spacing:0;margin-top:4px}
.sp{flex:1}
.acoes{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-bottom:4px}
/* botões Metro: borda de 2px, apertar = inverter as cores */
.bt{height:32px;padding:0 14px;border:2px solid rgba(255,255,255,.8);background:transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;font-weight:600;font-size:13px}
.bt:hover{background:rgba(255,255,255,.14)}.bt:active{background:#fff;color:#000}.bt:disabled{opacity:.4;cursor:default;background:transparent;color:inherit}
.bt.pri{background:var(--ac);border-color:var(--ac);color:#fff}.bt.pri:hover{background:#ff2a14;border-color:#ff2a14}
.bt.sm{height:26px;padding:0 9px;font-size:12px;border-width:1px;font-weight:400}
.bt.perigo{border-color:#ff6b5b;color:#ff8f82}
.lk{background:none;border:0;padding:2px 0;cursor:pointer;color:var(--mu);font-size:12px;text-decoration:none}.lk:hover{color:#fff;text-decoration:underline}
/* pivô (Shorts / Vídeos longos / Agenda) */
.pivo{display:flex;gap:clamp(18px,3vw,34px);padding:16px clamp(16px,4vw,56px) 0;flex-wrap:wrap}
.pivo button{background:none;border:0;padding:0;cursor:pointer;font:300 clamp(24px,3vw,34px)/1.2 var(--leve);color:var(--tx);opacity:.42;transition:opacity .15s}
.pivo button:hover{opacity:.75}.pivo button.on{opacity:1}
.pivo button i{font:400 13px "Segoe UI",system-ui;font-style:normal;margin-left:6px;vertical-align:super;opacity:.8}
.pivo button.alvo{opacity:1;outline:2px dashed var(--ac);outline-offset:4px}
/* filtros */
.filtros{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:14px clamp(16px,4vw,56px) 0}
input[type=search],input[type=text],input[type=datetime-local],input[type=date],select,textarea{height:32px;background:rgba(255,255,255,.88);color:#000;border:2px solid transparent;padding:0 8px;outline:none;max-width:100%}
input:focus,select:focus,textarea:focus{background:#fff;border-color:var(--ac)}
select option{color:#000}
.filtros input[type=search]{flex:0 1 260px;min-width:160px}
/* "hoje" */
.hoje{margin:14px clamp(16px,4vw,56px) 0;display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}
.hoje .rot{background:var(--ac);padding:8px 14px;display:flex;flex-direction:column;justify-content:center;min-width:120px}
.hoje .rot b{font:300 24px/1 var(--leve)}.hoje .rot small{font-size:12px;opacity:.9;margin-top:3px}
.hoje .h{background:var(--p);padding:8px 12px;display:flex;flex-direction:column;justify-content:center;max-width:280px;cursor:pointer;border-left:4px solid var(--agendado)}
.hoje .h:hover{background:var(--p2)}.hoje .h b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hoje .h small{color:var(--mu);font-size:12px}
.hoje .vz{color:var(--mu);padding:8px 2px;align-self:center}
/* faixas (colunas) que rolam para o lado, como no Windows 8 */
.quadro{display:flex;gap:22px;overflow-x:auto;padding:18px clamp(16px,4vw,56px) 30px;align-items:flex-start;scrollbar-color:#555 transparent}
.faixa{flex:0 0 300px;display:flex;flex-direction:column;min-height:200px}
.faixa>h2{margin:0 0 10px;font:300 22px/1.2 var(--leve);display:flex;align-items:baseline;gap:8px;border-top:4px solid var(--c);padding-top:6px}
.faixa>h2 i{font:400 13px "Segoe UI",system-ui;font-style:normal;color:var(--mu)}
.faixa>h2 .sp{flex:1}
.faixa .dica{color:var(--mu2);font-size:12px;margin:-4px 0 8px}
.faixa .cards{display:flex;flex-direction:column;gap:6px;min-height:120px;padding:2px;margin:-2px;flex:1}
.faixa.alvo .cards{outline:2px dashed var(--c);background:rgba(255,255,255,.04)}
.faixa .vazio{color:var(--mu2);font-size:12.5px;padding:18px 10px;border:1px dashed #444;text-align:center}
.card{background:var(--p);border-left:4px solid var(--c);display:flex;flex-direction:column;cursor:default;outline:2px solid transparent;outline-offset:-2px;transition:transform .12s var(--entra)}
.card:hover{outline-color:rgba(255,255,255,.35)}
.card[draggable=true]{cursor:grab}.card.arrasta{opacity:.4}
.card .th{display:block;aspect-ratio:16/9;background:#000 center/cover no-repeat;position:relative;overflow:hidden}
.card.short .th{background-size:contain}
.card .th video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.card .th .sel{position:absolute;left:6px;top:6px;width:18px;height:18px;margin:0;accent-color:var(--ac)}
.card .tx{padding:8px 10px 6px;display:grid;gap:3px;min-width:0}
.card .tx b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ln{display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center;color:var(--mu);font-size:12px}
.card .quando{color:#fff;font-size:12.5px}
.card .ac{display:flex;gap:4px 12px;flex-wrap:wrap;padding:0 10px 8px}
.canal{display:inline-flex;align-items:center;gap:5px;min-width:0}.canal i{width:10px;height:10px;flex:none;background:var(--cc,#777)}
.semcanal{color:#ffb38a;font-weight:600}
.lk.forte{color:#fff;font-weight:600;text-decoration:underline}
.selo-atr{justify-self:start;background:var(--atr);color:#fff;font-size:11px;font-weight:600;padding:1px 7px;text-transform:uppercase;letter-spacing:.5px}
.ev.atr{background:rgba(229,20,0,.28)}.ev.atr em{color:#ffb0a6}
.atrasos{background:#5c0a00;border-left:6px solid var(--atr);padding:10px 14px;margin:14px 0 0;display:flex;flex-direction:column;gap:6px}
.atrasos>b{font:300 22px/1.1 var(--leve)}.atrasos .a{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.atrasos .a>span{flex:1;min-width:200px}
.quem{display:inline-flex;align-items:center;gap:4px}.quem img{width:14px;height:14px}
/* agenda do mês */
.agenda{padding:16px clamp(16px,4vw,56px) 40px}
.ag-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ag-cab h2{margin:0;font:300 28px/1.1 var(--leve);min-width:240px;text-transform:lowercase}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px}.seg button{border:2px solid rgba(255,255,255,.55);background:transparent;min-height:30px;padding:2px 12px;cursor:pointer;font-size:13px}
.seg button:hover{background:rgba(255,255,255,.12)}.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mes .sem{font-size:12px;color:var(--mu);padding:0 4px 2px;text-transform:lowercase}
.dia{background:var(--p);min-height:112px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.dia.fora{background:#242424;opacity:.55}.dia.hj{outline:2px solid var(--ac);outline-offset:-2px}
.dia .n{font:300 20px/1 var(--leve);padding:2px 2px 4px}.dia.hj .n{color:#ff7a6b}
.dia.alvo{background:var(--p3);outline:2px dashed #fff;outline-offset:-2px}
.ev{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--cc,#777);background:rgba(255,255,255,.08);padding:2px 5px;font-size:11.5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev:hover{background:rgba(255,255,255,.18)}.ev[draggable=true]{cursor:grab}
.ev em{font-style:normal;color:var(--mu)}.ev.st-noAr{opacity:.7}.ev.st-concluido em,.ev.st-pedido em{color:#ffb38a}
.legenda{display:flex;gap:6px 16px;flex-wrap:wrap;color:var(--mu);font-size:12px;margin-top:12px}
.legenda span{display:inline-flex;align-items:center;gap:5px}.legenda i{width:12px;height:12px;background:var(--cc)}
@media (max-width:760px){.mes{grid-template-columns:1fr}.mes .sem,.dia.fora{display:none}.dia{min-height:0}}
.rod{color:var(--mu2);font-size:12px;padding:0 clamp(16px,4vw,56px) 40px}
.erro{background:#a20025;padding:8px 12px;margin:10px 0}
.aviso{background:#3b2a00;border-left:4px solid var(--agendado);padding:8px 12px;margin:10px 0}
/* painel lateral (entra pela direita) */
.pfundo{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45)}
.painel{position:fixed;top:0;right:0;bottom:0;z-index:21;width:min(420px,100%);background:#1f1f1f;border-left:1px solid #3a3a3a;display:flex;flex-direction:column;animation:entra .32s var(--entra)}
@keyframes entra{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
.painel .pc{background:var(--ac);padding:18px 20px 14px;display:flex;align-items:center;gap:12px}
.painel .pc h3{margin:0;font:300 26px/1.1 var(--leve);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.painel .pc button{background:none;border:2px solid #fff;color:#fff;width:32px;height:32px;cursor:pointer;font-size:16px;flex:none}
.painel .pb{padding:16px 20px 24px;overflow:auto;flex:1}
label.r{display:block;font-size:12px;color:var(--mu);margin:14px 0 5px;text-transform:lowercase;letter-spacing:.2px}
.painel input[type=text],.painel input[type=datetime-local],.painel select,.jan input[type=text],.jan input[type=datetime-local],.jan select,.jan input[type=file],.jan textarea{width:100%}
textarea{height:auto;min-height:90px;padding:6px 8px;resize:vertical}
.nota{font-size:12px;color:var(--mu);margin-top:8px}
.pes{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
/* janela (faixa na largura toda, como as mensagens do Windows 8) */
.fundo{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:center}
.jan{width:100%;max-height:calc(100vh - 20px);overflow:auto;background:#262626;border-top:1px solid #444;border-bottom:1px solid #444;padding:22px clamp(16px,12vw,240px);animation:entra .32s var(--entra)}
.jan>*{max-width:720px}
.jan h3{margin:0 0 12px;font:300 28px/1.15 var(--leve)}
.jan video{width:100%;max-height:220px;background:#000;display:block}
.jan a{color:#5ac8fa;word-break:break-all}
.canal-cx{display:flex;align-items:center;gap:10px;background:var(--p2);padding:8px 10px}
.canal-cx img,.canal-cx .sem{width:32px;height:32px;background:#555;flex:none}.canal-cx .tx{flex:1;min-width:0}.canal-cx small{color:var(--mu);display:block}
.vias{display:grid;gap:4px}.vias button{text-align:left;border:2px solid transparent;background:var(--p2);padding:8px 12px;cursor:pointer}
.vias button.on{border-color:var(--ac);background:#3a1a16}.vias button small{display:block;color:var(--mu);font-size:12px}.vias button:disabled{opacity:.4;cursor:default}
.opc{display:flex;gap:16px;flex-wrap:wrap}.opc label{display:flex;gap:6px;align-items:center;font-size:13px}
.barra{height:4px;background:#444;overflow:hidden;margin:14px 0 6px}.barra i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
.okcx{background:#2d5a12;padding:10px 12px}
.cola{display:grid;gap:6px;background:var(--p2);padding:10px 12px;margin-top:8px}
.cola .l{display:flex;gap:10px;align-items:flex-start}.cola .l span{color:var(--mu);width:120px;flex:none;font-size:12.5px}.cola .l b{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;font-weight:500}
.passo{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}.passo i{font-style:normal;width:24px;height:24px;background:var(--ac);display:grid;place-items:center;font-size:12px;flex:none}
.canais-ed{display:grid;gap:6px}.canais-ed .l{display:flex;gap:6px}.canais-ed input{flex:1}
.prog-l{display:grid;gap:4px;margin-top:10px}.prog-l .l{display:flex;gap:8px;font-size:13px;background:var(--p2);padding:4px 8px}.prog-l .l b{flex:1;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.prog-l .l span{color:var(--mu)}
.escolha{display:grid;gap:4px}.escolha button{display:flex;align-items:center;gap:12px;text-align:left;background:var(--p2);border:2px solid transparent;padding:12px;cursor:pointer}
.escolha button:hover{border-color:rgba(255,255,255,.5)}.escolha button b{display:block;font:300 19px/1.2 var(--leve)}.escolha button small{color:var(--mu)}
.escolha button .q{width:40px;height:40px;flex:none;background:var(--c,var(--ac))}
/* aviso que some sozinho */
.toast{position:fixed;right:20px;bottom:20px;z-index:40;background:#2b2b2b;border-left:4px solid var(--ac);padding:12px 16px;max-width:min(420px,calc(100% - 40px));animation:entra .3s var(--entra)}
@media (max-width:700px){.faixa{flex-basis:84vw}.cola .l{flex-wrap:wrap}.cola .l span{width:100%}}
</style>
</head>
<body>
<header class="top">
  <h1><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14"/><path d="M10 9.3v5.4l4.6-2.7z" fill="#fff"/></svg></span><span>publicações<small>organizar os vídeos da equipe no YouTube</small></span></h1>
  <div class="sp"></div>
  <div class="acoes">
    <button class="bt pri" id="btNovo" title="Pôr um vídeo na organização da equipe">+ Adicionar</button>
    <button class="bt" id="btAtualizar" title="Busca a lista da equipe de novo">Atualizar</button>
    <button class="bt" id="btCanais" hidden title="Canais da equipe (nome e ID): todo mundo escolhe nesta lista">Canais</button>
    <span data-estudio-conta></span>
  </div>
  <input type="file" id="arq" accept="video/*" hidden>
</header>
<nav class="pivo" id="pivo"></nav>
<div class="filtros">
  <input type="search" id="fBusca" placeholder="buscar pelo título" aria-label="Buscar pelo título">
  <select id="fCanal" aria-label="Canal"></select>
  <select id="fProg" aria-label="Programa de origem"></select>
  <select id="fQuem" aria-label="Quem enviou"></select>
  <button class="lk" id="fLimpa">limpar filtros</button>
</div>
<div id="avisos" style="padding:0 clamp(16px,4vw,56px)"></div>
<main id="area"></main>
<div class="rod" id="rodInfo"></div>
<script>
'use strict';
/* PUBLICAÇÕES — organizar o que a equipe põe no YouTube (pedido da dona, 05/11 e 10/11/2026).
   - Duas abas por FORMATO: Shorts (vídeo em pé) e Vídeos longos (deitado). O formato vem sozinho da medida do vídeo exportado
     (altura > largura = Short); dá para mudar no "Mover". Mais a AGENDA do mês, com as datas de tudo.
   - Em cada aba, faixas lado a lado: Neste navegador · Não publicados · Na fila · Agendados · Não listados · Publicados.
     Arrastar um cartão para outra faixa, para a outra aba ou para outro dia da agenda MOVE ele (o painel "Mover" faz o mesmo sem
     arrastar). Mover um vídeo que já está no YouTube muda só a organização do Estúdio: no YouTube muda-se pelo Studio.
   - CANAL PADRÃO por programa: Animador → Turma do Problems, Editor → Problems; Shorts não tem padrão (a pessoa escolhe).
   - SEM LIGAÇÃO COM O YOUTUBE (pedido da dona, 10/11/2026): só organização à mão. Postar = pelo YouTube Studio com a colinha (ou deixar na
     fila para outra pessoa). Agendado NÃO vira "no ar" sozinho: depois da hora alguém clica "Confirmar que saiu" (confirmadoEm);
     agendado sem confirmação, ou não publicado com a data planejada vencida, aparece como ATRASADO (faixa vermelha no topo).
   - Os outros programas deixam o vídeo no IndexedDB 'ep-publicacoes' e abrem esta página com ?video=<id> (/estudio-youtube.js).
   - A LISTA da equipe (itens, pedidos, concluídos e canais) é UM JSON no turma-ia (GET/POST/DELETE /publicacoes), guardado em
     'ep-publicacoes-v1' e buscado de novo só se tiver mais de 10 min (ou no "Atualizar"). Filtros rodam aqui ('ep-publicacoes-filtro').
   - Agendado: lembrete no calendário pessoal do Estúdio ('ep-calendario', o mesmo do relógio do estudio-conta.js). */
const SERV = 'https://turma-ia.problemsraiz.workers.dev', LS = 'ep-publicacoes-v1', LSF = 'ep-publicacoes-filtro', VELHA = 10 * 60e3;
const YT = window.EstudioYouTube, $ = s => document.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pode = k => { try { return window.EstudioPerm?.pode?.(k) ?? true; } catch { return true; } };
const PROGS = { animador: 'Animador', shorts: 'Shorts', editor: 'Editor', publicacoes: 'Publicações' };
const mb = n => { const m = (n || 0) / 1048576; return (m < 10 ? m.toFixed(1).replace('.', ',') : Math.round(m)) + ' MB'; };
const hora = t => new Date(t).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const dataH = t => { const d = new Date(t), h = new Date(); const dia = d.toDateString() === h.toDateString() ? 'hoje' : new Date(+h + 864e5).toDateString() === d.toDateString() ? 'amanhã' : new Date(+h - 864e5).toDateString() === d.toDateString() ? 'ontem' : d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short', year: d.getFullYear() !== h.getFullYear() ? 'numeric' : undefined }).replace(/\./g, ''); return `${dia} às ${hora(t)}`; };
const mesmoDia = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
const novoId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const idDoLink = s => { s = String(s || '').trim(); const m = /(?:youtu\.be\/|[?&]v=|\/shorts\/|\/video\/|\/live\/|\/embed\/)([A-Za-z0-9_-]{11})/.exec(s); return m ? m[1] : /^[A-Za-z0-9_-]{11}$/.test(s) ? s : null; };
const canalDoTexto = s => { const m = /(UC[A-Za-z0-9_-]{22})/.exec(String(s || '')); return m ? m[1] : null; };
const privDe = modo => modo === 'agora' ? 'public' : modo === 'agendado' ? 'private' : 'unlisted';
const MODOS = { naoListado: 'Não listado', agora: 'Público', agendado: 'Agendado' };
const emLocal = t => new Date(t - new Date(t).getTimezoneOffset() * 60e3).toISOString().slice(0, 16);
let toastT; const toast = (txt, cor) => { document.querySelector('.toast')?.remove(); const d = document.createElement('div'); d.className = 'toast'; if (cor) d.style.borderColor = cor; d.textContent = txt; document.body.appendChild(d); clearTimeout(toastT); toastT = setTimeout(() => d.remove(), 5000); };

// ---------- canais: os dois fixos da equipe + os que um ADM cadastrou ----------
const TURMA = { id: 'UC3V4c447QO0zEyTJlsqqSWQ', nome: 'Turma do Problems', arroba: '@turmadoproblemsoficial' };
const PROBLEMS = { id: 'UCrcBZDofBltcgGxphNia2tw', nome: 'Problems', arroba: '@problemsyt' };
const CANAL_DO_PROG = { animador: TURMA, editor: PROBLEMS }; // Shorts: sem padrão, a pessoa escolhe
const CORES = ['#a200ff', '#1ba1e2', '#00aba9', '#d80073', '#8cbf26', '#f0a30a', '#6a00ff', '#a0522d'];
const canaisTodos = () => { const m = new Map(); [TURMA, PROBLEMS, ...(L.canais || [])].forEach(c => c?.id && !m.has(c.id) && m.set(c.id, { id: c.id, nome: c.nome })); return [...m.values()]; };

// ---------- pintar ----------

// ---------- agenda do mês ----------

      try { guardaL(await pede('/publicacoes', { method: 'POST', body: JSON.stringify({ canais: ok }) })); P.fecha(); pinta(); } catch (er) { erro = er.message; pintaC(); }
    };
  };
  pintaC();
};

// ---------- começo ----------
async function comeca() {
  await EstudioLogin.pronto;
  if (window.EstudioPerm?.programa?.('publicacoes') === false) { $('#area').innerHTML = '<div class="aviso" style="margin:20px clamp(16px,4vw,56px)">Você ainda não tem acesso ao Publicações. Peça para um ADM liberar.</div>'; return; }
  pinta(); buscar(false); await carregaLocais();
  const q = new URLSearchParams(location.search).get('video');
  if (q) { history.replaceState(null, '', location.pathname); const v = ESP.find(x => x.id === q);
    if (v?.concluir) { try { await organizar(v); } catch (er) { toast('Não consegui pôr em Não publicados: ' + er.message + ' (o vídeo ficou em "Neste navegador").', '#ff6b5b'); } }
    else if (v) { const f = formatoDaMedida(await medir(v.blob)); if (f) { v.formato = f; try { await YT.fila.poe(v); } catch { } F.piv = f; guardaF(); pinta(); } if (pode('publicacoes.publicar')) publicar(v); } }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { buscar(false); carregaLocais(); } });
  setInterval(() => document.visibilityState === 'visible' && !ARR && !document.querySelector('.painel,.fundo') && pinta(), 60e3);
  addEventListener('storage', e => { if (e.key === LS) { try { L = JSON.parse(e.newValue) || L; } catch { } pinta(); } });
  window.EstudioConta?.espaco?.registrar({ programa: 'Publicações', async listar() { return ESP.map(v => ({ nome: v.titulo || v.nome, bytes: v.blob?.size || 0, data: v.em, rotuloBaixar: 'Baixar o vídeo', baixar: async () => baixar(v.blob, v.nome), apagar: async () => { await YT.fila.tira(v.id); carregaLocais(); } })); } });
}
comeca();
</script>
